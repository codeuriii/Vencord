name: Sync upstream

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream safely
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git remote add upstream https://github.com/Vendicated/Vencord.git
          git fetch upstream

          git checkout main

          # rien de nouveau upstream
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse upstream/main)" ]; then
            echo "Upstream déjà à jour"
            exit 0
          fi

          # tentative fast-forward uniquement
          git merge --ff-only upstream/main
          git push origin main
